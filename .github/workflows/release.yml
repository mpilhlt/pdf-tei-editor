name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:  # allow re-running semantic-release for current main HEAD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write        # push release commit + tag, push back-merge branch
  issues: write          # @semantic-release/github
  pull-requests: write   # @semantic-release/github comments + back-merge PR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
      version: ${{ steps.result.outputs.version }}
      release_sha: ${{ steps.result.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true  # required so @semantic-release/git can push

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture HEAD before release
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Determine release result
        id: result
        run: |
          # A real release makes @semantic-release/git commit CHANGELOG.md +
          # package.json and advance local HEAD. No new commit => no release.
          BEFORE="${{ steps.before.outputs.sha }}"
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" != "$AFTER" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_sha=${AFTER}" >> "$GITHUB_OUTPUT"
            echo "Released v${VERSION} (${AFTER})"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No release produced for this push."
          fi

  docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ needs.release.outputs.release_sha }}
    secrets: inherit

  release-notes-footer:
    needs: [release, docker]
    if: ${{ always() && needs.release.outputs.published == 'true' && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Append Docker image info to the GitHub Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          TAG="v${VERSION}"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if grep -q '## Docker Image' "$RUNNER_TEMP/notes.md"; then
            echo "Docker section already present; nothing to append."
            exit 0
          fi
          {
            echo ""
            echo "## Docker Image"
            echo ""
            echo '```bash'
            echo "docker pull cboulanger/pdf-tei-editor:${VERSION}"
            echo "docker pull cboulanger/pdf-tei-editor:latest"
            echo '```'
            echo ""
            echo "[View on Docker Hub](https://hub.docker.com/r/cboulanger/pdf-tei-editor/tags?name=${VERSION})"
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  back-merge:
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Open auto-merge back-merge PR into devel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          BRANCH="chore/back-merge-v${VERSION}"
          git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/devel:refs/remotes/origin/devel
          if git diff --quiet origin/main origin/devel; then
            echo "devel already contains main; nothing to back-merge."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" origin/main
          git push origin "$BRANCH"
          gh pr create --base devel --head "$BRANCH" \
            --title "chore: back-merge v${VERSION} into devel" \
            --body "Automated back-merge of the \`v${VERSION}\` release commit (\`package.json\` + \`CHANGELOG.md\`) from \`main\` into \`devel\`. Merge with a merge commit." \
          || { echo "PR already exists"; }
          # PR is created with GITHUB_TOKEN, so pr-tests.yml does not run on it.
          # Try an immediate merge first (works while devel has no required
          # checks); fall back to auto-merge if devel later gains a required
          # check; otherwise leave the PR open for a manual merge.
          gh pr merge "$BRANCH" --merge \
          || gh pr merge "$BRANCH" --auto --merge \
          || echo "Back-merge PR left open for manual merge."
