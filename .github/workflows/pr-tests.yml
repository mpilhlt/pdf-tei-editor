name: Tests

on:
  pull_request:
    branches:
      - main
      - devel
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for proper git diff

      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        run: |
          # Get files changed in this PR compared to base branch
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA | tr '\n' ' ')

          # Export for use in next step
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED_FILES"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies for smart test runner
        run: npm ci --ignore-scripts

      - name: Check if tests are needed
        id: check-tests
        run: |
          # Run smart test runner with --names-only to get list of tests
          if [ -n "${{ steps.changed-files.outputs.files }}" ]; then
            echo "Checking which tests need to run for changed files..."
            TEST_FILES=$(npm run test:changed -- --names-only ${{ steps.changed-files.outputs.files }} 2>/dev/null | grep -v '^>' || true)
          else
            echo "No files changed, checking for always-run tests..."
            TEST_FILES=$(npm run test:changed -- --names-only 2>/dev/null | grep -v '^>' || true)
          fi

          # Check if any test files were found
          if [ -z "$TEST_FILES" ]; then
            echo "needs_tests=false" >> $GITHUB_OUTPUT
            echo "needs_e2e=false" >> $GITHUB_OUTPUT
            echo "No tests need to run"
          else
            echo "needs_tests=true" >> $GITHUB_OUTPUT
            echo "Tests to run:"
            echo "$TEST_FILES"

            # Check if any E2E tests are in the list
            if echo "$TEST_FILES" | grep -q "tests/e2e/"; then
              echo "needs_e2e=true" >> $GITHUB_OUTPUT
              echo "E2E tests detected - container will be needed"
            else
              echo "needs_e2e=false" >> $GITHUB_OUTPUT
              echo "No E2E tests - will run natively"
            fi
          fi

      - name: Set up Python
        if: steps.check-tests.outputs.needs_tests == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        if: steps.check-tests.outputs.needs_tests == 'true'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        if: steps.check-tests.outputs.needs_tests == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm ci
          uv sync

      - name: Run tests natively
        if: steps.check-tests.outputs.needs_tests == 'true' && steps.check-tests.outputs.needs_e2e == 'false'
        run: |
          # Ensure uv is in PATH
          export PATH="$HOME/.cargo/bin:$PATH"

          # Run unit and API tests natively (faster, no container needed)
          if [ -n "${{ steps.changed-files.outputs.files }}" ]; then
            echo "Running tests for changed files..."
            npm run test:changed -- ${{ steps.changed-files.outputs.files }}
          else
            echo "No files changed, running always-run tests only..."
            npm run test:changed
          fi

      - name: Set up Docker Buildx
        if: steps.check-tests.outputs.needs_e2e == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for E2E tests
        if: steps.check-tests.outputs.needs_e2e == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci
          push: false
          load: true
          tags: pdf-tei-editor:ci
          cache-from: |
            type=gha,scope=buildkit-ci
            type=gha,scope=buildkit-ci-${{ github.base_ref || github.ref_name }}
          cache-to: type=gha,mode=max,scope=buildkit-ci

      - name: Run tests in container
        if: steps.check-tests.outputs.needs_e2e == 'true'
        run: |
          # Run all tests in container (needed for E2E browser support)
          if [ -n "${{ steps.changed-files.outputs.files }}" ]; then
            echo "Running tests for changed files..."
            docker run --rm pdf-tei-editor:ci ${{ steps.changed-files.outputs.files }}
          else
            echo "No files changed, running always-run tests only..."
            docker run --rm pdf-tei-editor:ci
          fi


      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const jobStatus = '${{ job.status }}';
            const needsTests = '${{ steps.check-tests.outputs.needs_tests }}';
            const runId = context.runId;
            const serverUrl = context.serverUrl;
            const repo = context.repo;

            let body = '## Test Results\n\n';

            const needsE2E = '${{ steps.check-tests.outputs.needs_e2e }}';

            if (needsTests === 'false') {
              body += '✅ **No tests needed!**\n\n';
              body += 'Changed files were analyzed and no relevant tests were found. This PR does not affect any tested code.\n';
            } else if (jobStatus === 'success') {
              body += '✅ **All tests passed!**\n\n';
              if (needsE2E === 'true') {
                body += 'Tests were run in a containerized environment (E2E tests included). Changed files were analyzed and only relevant tests were executed.\n';
              } else {
                body += 'Tests were run natively (unit and API tests only). Changed files were analyzed and only relevant tests were executed.\n';
              }
            } else {
              body += '❌ **Tests failed**\n\n';
              body += '### Failed Test Suites\n\n';
              body += 'One or more test suites failed. Please check the details below:\n\n';
              body += `- [📋 View full test logs](${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId})\n\n`;
              body += '### Next Steps\n\n';
              body += '1. Review the [test logs](${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId})\n';
              body += '2. Run tests locally: `npm run test:changed`\n';
              body += '3. Run tests in container: `npm run test:container`\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  release-preview:
    # Only for PRs whose TARGET branch is main (typically devel -> main, also any
    # hotfix -> main). Never runs on PRs targeting devel. The PR's source branch
    # is irrelevant.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      # write, not read: semantic-release runs an unconditional `git push
      # --dry-run` auth check (index.js, even under --dry-run) before it will
      # analyse commits. The checkout below persists the GITHUB_TOKEN, so with
      # contents: write that check passes and nothing is actually pushed. On
      # fork PRs the token stays read-only and the preview degrades gracefully.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run semantic-release dry run
        id: dry
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # env-ci reads GITHUB_ACTIONS and reports a PR run's branch as
          # refs/pull/N/merge (step-level GITHUB_* overrides do not reach the
          # runner's own values inside a run step), so semantic-release finds no
          # matching release branch and computes nothing. Unset the CI markers
          # and it falls back to `git rev-parse --abbrev-ref HEAD` — the PR
          # source branch left checked out above — which --branches then treats
          # as releasable.
          #
          # --plugins narrows the run to the two analysis plugins: the preview
          # only needs the version + notes, not changelog/npm/git/github steps.
          # (semantic-release still runs its own unconditional `git push
          # --dry-run` auth check regardless — see the contents: write note.)
          # --dry-run publishes nothing.
          env -u GITHUB_ACTIONS -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH -u GITHUB_REF -u CI \
            npx semantic-release --dry-run --no-ci --branches "$HEAD_REF" \
              --plugins @semantic-release/commit-analyzer @semantic-release/release-notes-generator \
            2>&1 | tee "$RUNNER_TEMP/semrel.log" || true
          NEXT_VERSION="$(grep -oiE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/semrel.log" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)"
          {
            echo "## Release preview"
            echo ""
            if [ -n "$NEXT_VERSION" ]; then
              echo "Merging this PR (as a **merge commit**) will publish **v${NEXT_VERSION}**."
            else
              echo "No version-bumping commits found since the last release — **merging will not publish a release.**"
            fi
            echo ""
            echo "<details><summary>semantic-release --dry-run output</summary>"
            echo ""
            echo '```'
            tail -n 80 "$RUNNER_TEMP/semrel.log"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "_Preview generated by \`semantic-release --dry-run\`. Do not squash \`devel → main\` PRs._"
          } > "$RUNNER_TEMP/preview.md"
          echo "preview_file=$RUNNER_TEMP/preview.md" >> "$GITHUB_OUTPUT"

      - name: Post / update sticky preview comment
        if: always()
        uses: actions/github-script@v9
        env:
          PREVIEW_FILE: ${{ steps.dry.outputs.preview_file }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- semantic-release-preview -->';
            const file = process.env.PREVIEW_FILE || '';
            const md = file && fs.existsSync(file)
              ? fs.readFileSync(file, 'utf8')
              : 'Release preview could not be generated — see the job log.';
            const body = marker + '\n' + md;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
