name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      version:
        description: 'Image tag without leading v, e.g. 1.2.3'
        required: true
        type: string
      ref:
        description: 'Git ref/SHA to build (the release commit)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: docker-build-${{ inputs.version }}

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Create more disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # inputs.version MUST equal the package.json version at inputs.ref — the
      # caller (release.yml) guarantees this by passing the semantic-release
      # output and the release commit SHA.
      - name: Build and push
        id: docker_build
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/pdf-tei-editor
          registry: docker.io
          pushImage: true
          tags: ${{ inputs.version }},latest
          target: production

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
