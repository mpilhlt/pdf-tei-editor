name: Build and Push Docker Image

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: docker-build-${{ github.ref }}
#  cancel-in-progress: true


jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Create more disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        id: version
        run: |
          # Derive the version from the committed package.json (and require a
          # matching v<version> git tag to exist). Robust to squash-merged
          # release PRs, unlike inspecting HEAD's tags/second parent — see the
          # matching note in release.yml's "Get tag for current commit".
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n 1)
          if [ -n "$VERSION" ] && git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "Docker image tag: ${VERSION}"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "No tag v${VERSION} found, using 'latest'"
          fi

      - name: Build and push
        id: docker_build
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/pdf-tei-editor
          registry: docker.io
          pushImage: true
          tags: ${{ steps.version.outputs.is_tag == 'true' && format('{0},latest', steps.version.outputs.tag) || 'latest' }}
          target: production

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
