<!-- XML Editor spacer and import/export buttons. The spacer is followed by the toolbar sections
     [history & review] | [import & export] | [plugin additions], see XmlEditorPlugin.addToolbarWidget() -->
<status-spacer></status-spacer>

<status-button
  name="uploadBtn"
  icon="cloud-upload"
  tooltip="Upload document"
  action="xml-upload">
</status-button>

<status-button
  name="downloadBtn"
  icon="cloud-download"
  tooltip="Download XML document"
  action="xml-download">
</status-button>
