<!-- XML Editor right-hand toolbar sections:
     [document history & review] | [import & export] | [plugin additions]
     Plugins add their buttons to a section with `addToolbarWidget(widget, priority, section)`.
     A section separator is only shown while the section before or after it has a visible button. -->
<status-spacer></status-spacer>

<status-separator name="reviewSectionSeparator" variant="vertical"></status-separator>

<status-button
  name="uploadBtn"
  icon="cloud-upload"
  tooltip="Upload document"
  action="xml-upload">
</status-button>

<status-button
  name="downloadBtn"
  icon="cloud-download"
  tooltip="Download XML document"
  action="xml-download">
</status-button>

<status-separator name="pluginSectionSeparator" variant="vertical"></status-separator>
