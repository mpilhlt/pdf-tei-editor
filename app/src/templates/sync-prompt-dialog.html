<sl-dialog name="syncPromptDialog" label="Synchronize text changes?" class="dialog-stacked">
  <div class="dialog-column">
    <p name="message"></p>
    <p>To undo unintended changes, use Apply fix in the diagnostics panel. <a name="showChanges" href="#" class="sync-prompt-show-changes">Show changes</a></p>
    <sl-checkbox name="dontAsk" size="small">Don't ask again for this document. I will run Tools › OCR › Write text corrections to PDF myself.</sl-checkbox>
  </div>
  <sl-button slot="footer" name="notNow" variant="neutral">Not now</sl-button>
  <sl-button slot="footer" name="synchronize" variant="primary">Synchronize</sl-button>
</sl-dialog>
