<!-- XML Editor TEI action buttons -->
<status-separator variant="vertical"></status-separator>

<status-button
  name="validateBtn"
  icon="file-earmark-check"
  tooltip="Validate the document"
  action="xml-validate">
</status-button>

<status-button
  name="undoBtn"
  icon="arrow-counterclockwise"
  tooltip="Undo"
  action="xml-undo">
</status-button>

<status-button
  name="redoBtn"
  icon="arrow-clockwise"
  tooltip="Redo"
  action="xml-redo">
</status-button>
