<sl-alert name="pluginUpdateAlert" variant="primary" closable duration="30000">
  <sl-icon slot="icon" name="arrow-up-circle"></sl-icon>
  <div style="display: flex; flex-direction: column; gap: 0.5rem;">
    <span name="updateText">Plugin updates are available.</span>
    <div>
      <sl-button name="openBtn" variant="primary" size="small">Open plugin manager</sl-button>
    </div>
  </div>
</sl-alert>
