<sl-dialog name="documentRulesProposeDialog" label="Propose upstream" style="--width: 80vw;">
  <div style="display: flex; gap: 1.5rem; margin-bottom: 0.75rem;">
    <sl-checkbox name="includeHuman" size="small">Guide section (human)</sl-checkbox>
    <sl-checkbox name="includeMachine" size="small">Machine rules</sl-checkbox>
  </div>

  <div name="notice" style="display: none; margin-bottom: 0.75rem; font-size: var(--sl-font-size-small);"></div>

  <div name="files"></div>

  <div name="hint" style="margin-top: 0.75rem; font-size: var(--sl-font-size-small); color: var(--sl-color-neutral-600);">Apply the patch in a clone of the guide repository with "git apply &lt;file&gt;", then commit and open a pull request.</div>

  <div slot="footer" style="display: flex; justify-content: flex-end; gap: 0.5rem; width: 100%;">
    <sl-button name="downloadBtn" size="small" variant="primary" disabled>Download patch</sl-button>
    <sl-button name="closeBtn" size="small">Close</sl-button>
  </div>
</sl-dialog>
