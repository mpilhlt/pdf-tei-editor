<sl-drawer name="diagnosticsDrawer" class="diagnostics-drawer empty" placement="start" contained no-header>
  <div name="header" class="diagnostics-drawer-header">
    <sl-icon name="exclamation-triangle"></sl-icon>
    <span class="diagnostics-drawer-title">Diagnostics</span>
    <sl-badge name="count" variant="neutral" pill>0</sl-badge>
  </div>
  <div name="list" class="diagnostics-drawer-list" role="list"></div>
  <div slot="footer" name="footer" class="diagnostics-drawer-footer">
    <sl-checkbox name="selectAll" size="small">Select all</sl-checkbox>
    <span class="diagnostics-drawer-footer-buttons">
      <sl-button name="applyBtn" size="small" variant="primary" disabled>Apply</sl-button>
      <sl-button name="dismissBtn" size="small" disabled>Dismiss</sl-button>
      <sl-tooltip content="Delete the review marks and comment threads of the checked entries from the document (undo with Ctrl+Z). Other diagnostics are dismissed.">
        <sl-button name="deleteBtn" size="small" variant="danger" outline disabled style="display: none">Delete</sl-button>
      </sl-tooltip>
    </span>
  </div>
</sl-drawer>
<button name="diagnosticsButton" type="button" class="diagnostics-drawer-button" title="Show diagnostics" hidden>
  <sl-icon name="exclamation-triangle"></sl-icon>
  <span>Diagnostics</span>
  <sl-badge name="count" variant="neutral" pill>0</sl-badge>
</button>
