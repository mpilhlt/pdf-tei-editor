<!-- Merge view widgets, added to the left section of the XML editor toolbar by the merge-view plugin -->
 <style>
  /* Highlight diff buttons when active */
  .merge-view-highlight.merge-view-navigation {
    background-color: hsl(230, 65%, 59%) !important;
    color: white !important;
  }
  .merge-view-highlight.merge-view-reject-all {
    background-color: hsl(0, 65%, 59%) !important;
    color: white !important;
  }
  .merge-view-highlight.merge-view-accept-all {
    background-color: hsl(121, 65%, 59%) !important;
    color: white !important;
  }
 </style>
<status-button
  class="merge-view-navigation"
  name="prevDiffBtn"
  icon="chevron-bar-up"
  tooltip="Previous diff"
  action="xml-prev-diff">
</status-button>
<status-button
  class="merge-view-navigation"
  name="nextDiffBtn"
  icon="chevron-bar-down"
  tooltip="Next diff"
  action="xml-next-diff">
</status-button>

<status-separator variant="vertical"></status-separator>
<status-button
  class="merge-view-reject-all"
  name="rejectAllBtn"
  icon="x-circle"
  tooltip="Reject all changes"
  action="xml-reject-all">
</status-button>
<status-button
  class="merge-view-accept-all"
  name="acceptAllBtn"
  icon="check-circle"
  tooltip="Accept all changes"
  action="xml-accept-all">
</status-button>

<status-separator variant="vertical"></status-separator>
<status-toggle-button name="strictDiffToggle" appearance="flat" icon="paragraph" tooltip="Strict diff (whitespace &amp; linebreaks significant)"></status-toggle-button>
