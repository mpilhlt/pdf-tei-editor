[project]
name = "pdf-tei-editor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.119.0",
    "flask>=3.1.3",
    "jsonschema>=4.23.0",
    "llamore>=0.2.0",
    "tei-annotator>=1.7.0",
    "lxml>=6.1.0",
    "pdf2image>=1.17.0",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "routes>=2.5.1",
    "tqdm>=4.67.1",
    "uvicorn[standard]>=0.36.0",
    "waitress>=3.0.2",
    "webdav4[fsspec]>=0.10.0",
    "xmlschema>=4.3.2",
    "pypdf>=6.16.1",
]

[tool.uv.sources]
llamore = { git = "https://github.com/mpilhlt/llamore.git" }
tei-annotator = { git = "https://github.com/cboulanger/tei-annotator" }

[tool.uv]
# scipy <1.16.0 ships a _propack binary with a malformed Mach-O __thread_bss
# section that macOS 27's dyld rejects at import time (upstream fixed in 1.16.0).
constraint-dependencies = ["scipy>=1.16.0"]

[dependency-groups]
dev = [
    "cheroot>=10.0.0",
    "lxml-stubs>=0.5.1",
    "mypy>=2.3.1",
    "pdoc>=15.0.0",
    "pydeps>=3.0.1",
    "pytest>=8.4.0",
    "pytest-tap>=3.3",
    "send2trash>=2.1.0",
    "wsgidav>=4.3.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
markers = [
  "integration: marks tests as integration tests that check actual project structure (deselect with '-m \"not integration\"')"
]
